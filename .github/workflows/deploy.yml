name: deploy

on:
  push:
    branches: [main]
  # sync.yml commits videos.json with the default GITHUB_TOKEN, and a push made
  # with that token deliberately does NOT trigger other workflows — so the push
  # trigger above never fires for a sync. Without this schedule the repo keeps
  # gaining videos while the published site stays frozen at the last human push.
  # 30 minutes after sync.yml's 21:00 cron.
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fails loudly with the fix if the lockfile lost its Linux optional deps.
      - run: node scripts/check-lockfile.mjs
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
